<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Equipment Info</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Arial, sans-serif; background: #f2f4f7; margin: 0; padding: 16px; color: #1f2937; }
  .wrap { max-width: 520px; margin: 0 auto; }
  .card { background: #fff; border-radius: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; margin-bottom: 14px; }
  .hero-img { width: 100%; max-height: 260px; object-fit: cover; display: block; }
  .head { padding: 18px 18px 16px; }
  .head h1 { margin: 0 0 4px; font-size: 24px; line-height: 1.2; }
  .sub { color: #6b7280; font-size: 14px; margin-bottom: 12px; }
  .badges { display: flex; flex-wrap: wrap; gap: 8px; }
  .badge { display: inline-block; padding: 5px 13px; border-radius: 14px; font-weight: 700; font-size: 14px; }
  .status-OK { background: #2e7d32; color: #fff; }
  .status-DueSoon { background: #f9a825; color: #000; }
  .status-Overdue { background: #c62828; color: #fff; }
  .rows { padding: 4px 18px 8px; }
  .row { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid #eef0f3; }
  .row:last-child { border-bottom: none; }
  .row .k { color: #6b7280; font-size: 14px; flex-shrink: 0; }
  .row .v { font-weight: 600; text-align: right; word-break: break-word; }
  .notes { padding: 4px 18px 18px; }
  .notes .k { color: #6b7280; font-size: 14px; margin-bottom: 6px; }
  .notes .v { white-space: pre-wrap; }
  .actions { padding: 0 18px 18px; }
  button { padding: 13px 20px; font-size: 16px; cursor: pointer; border: none; border-radius: 10px; color: #fff; font-weight: 600; margin-right: 8px; }
  #saveBtn { background: #1565c0; }
  #editBtn, #cancelBtn { background: #4b5563; }
  .form { padding: 18px; }
  .field { margin-bottom: 14px; }
  label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 14px; color: #374151; }
  input, textarea, select { width: 100%; padding: 11px; font-size: 16px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; font-family: inherit; }
</style>
</head>
<body>
<div class="wrap" id="content">Loading...</div>

<script>
const params = new URLSearchParams(window.location.search);
const recordId = params.get("id");
let currentRecord = null;
let options = {};
let editing = false;

const LOCATION_COLORS = {
  "LA": ["#0b4fb3", "#fff"],
  "Kanona": ["#b45f06", "#fff"],
  "Personal": ["#ffd966", "#000"],
  "Whitby": ["#7c3aed", "#fff"],
  "Willowbrook": ["#e5e7eb", "#000"],
};
const PERSON_COLORS = {
  "X. Wang": ["#c6f3ee", "#000"],
  "M. Straube": ["#cdf3d4", "#000"],
  "J. Miller": ["#ffeab6", "#000"],
  "G. Cruz": ["#ffd9c9", "#000"],
  "A. Valmonte": ["#ffd0e8", "#000"],
};

function esc(v) {
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;")
    .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}

function badge(value, colorMap) {
  if (!value) return "";
  const c = colorMap[value] || ["#e5e7eb", "#000"];
  return `<span class="badge" style="background:${c[0]};color:${c[1]}">${esc(value)}</span>`;
}

function statusClass(status) {
  return status ? "status-" + status.replace(" ", "") : "";
}

function row(label, html) {
  return `<div class="row"><span class="k">${label}</span><span class="v">${html || "&mdash;"}</span></div>`;
}

async function loadRecord() {
  if (!recordId) {
    document.getElementById("content").innerText = "No equipment ID provided in the link.";
    return;
  }
  try {
    const [recRes, optRes] = await Promise.all([
      fetch(`/.netlify/functions/equipment?id=${recordId}`),
      fetch(`/.netlify/functions/equipment?schema=1`),
    ]);
    const data = await recRes.json();
    if (data.error) {
      document.getElementById("content").innerText = "Error loading record: " + JSON.stringify(data.error);
      return;
    }
    currentRecord = data;
    try {
      const o = await optRes.json();
      if (!o.error) options = o;
    } catch (e) {}
    render();
  } catch (e) {
    document.getElementById("content").innerText = "Error loading record: " + e.message;
  }
}

function pick(id, field, current) {
  const list = options[field];
  if (!list) return `<input id="${id}" value="${esc(current)}">`;
  const opts = ['<option value=""></option>']
    .concat(list.map((o) => `<option value="${esc(o)}"${o === current ? " selected" : ""}>${esc(o)}</option>`));
  return `<select id="${id}">${opts.join("")}</select>`;
}

function render() {
  const f = currentRecord.fields;
  const c = document.getElementById("content");

  if (!editing) {
    const photo = f["Photo"] && f["Photo"][0] ? `<img class="hero-img" src="${esc(f["Photo"][0].url)}">` : "";
    const status = f["Calibration Status"]
      ? `<span class="badge ${statusClass(f["Calibration Status"])}">${esc(f["Calibration Status"])}</span>` : "";
    c.innerHTML = `
      <div class="card">
        ${photo}
        <div class="head">
          <h1>${esc(f["Equipment Name"]) || "Unnamed equipment"}</h1>
          <div class="sub">${esc(f["Equipment Type"])}${f["Equipment Type"] && f["Serial Number"] ? " &middot; " : ""}${f["Serial Number"] ? "S/N " + esc(f["Serial Number"]) : ""}</div>
          <div class="badges">${status}${badge(f["Location"], LOCATION_COLORS)}</div>
        </div>
      </div>
      <div class="card">
        <div class="rows">
          ${row("Signed off to", badge(f["Signed Off To"], PERSON_COLORS))}
          ${row("Last calibration", esc(f["Last Calibration Date"]))}
          ${row("Calibration due", esc(f["Calibration Due Date"]))}
        </div>
        <div class="notes"><div class="k">Notes</div><div class="v">${esc(f["Notes"]) || "&mdash;"}</div></div>
        <div class="actions"><button id="editBtn" onclick="toggleEdit()">Edit</button></div>
      </div>
    `;
  } else {
    c.innerHTML = `
      <div class="card form">
        <div class="field"><label>Equipment Name</label><input id="f_name" value="${esc(f["Equipment Name"])}"></div>
        <div class="field"><label>Serial Number</label><input id="f_serial" value="${esc(f["Serial Number"])}"></div>
        <div class="field"><label>Equipment Type</label>${pick("f_type", "Equipment Type", f["Equipment Type"])}</div>
        <div class="field"><label>Location</label>${pick("f_location", "Location", f["Location"])}</div>
        <div class="field"><label>Signed Off To</label>${pick("f_signedoff", "Signed Off To", f["Signed Off To"])}</div>
        <div class="field"><label>Last Calibration Date</label><input type="date" id="f_lastcal" value="${esc(f["Last Calibration Date"])}"></div>
        <div class="field"><label>Calibration Due Date</label><input type="date" id="f_duecal" value="${esc(f["Calibration Due Date"])}"></div>
        <div class="field"><label>Notes</label><textarea id="f_notes" rows="4">${esc(f["Notes"])}</textarea></div>
        <button id="saveBtn" onclick="saveRecord()">Save Changes</button>
        <button id="cancelBtn" onclick="toggleEdit()">Cancel</button>
      </div>
    `;
  }
}

function toggleEdit() {
  editing = !editing;
  render();
}

async function saveRecord() {
  const val = (id) => document.getElementById(id).value.trim() || null;
  const updatedFields = {
    "Equipment Name": val("f_name"),
    "Serial Number": val("f_serial"),
    "Equipment Type": val("f_type"),
    "Location": val("f_location"),
    "Signed Off To": val("f_signedoff"),
    "Last Calibration Date": val("f_lastcal"),
    "Calibration Due Date": val("f_duecal"),
    "Notes": val("f_notes"),
  };

  const res = await fetch(`/.netlify/functions/equipment?id=${recordId}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ fields: updatedFields }),
  });
  const data = await res.json();
  if (data.error) {
    alert("Error saving: " + JSON.stringify(data.error));
    return;
  }
  currentRecord = data;
  editing = false;
  render();
}

loadRecord();
</script>
</body>
</html>
